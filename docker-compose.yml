name: ecoyantra-space

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_VERSION: 0.1.0
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      HOST: 0.0.0.0
      LOG_LEVEL: ${LOG_LEVEL:-info}
      NODE_ENV: production
      PORT: 4000
      TRUST_PROXY: 1
      MONGODB_URI: mongodb://mongo:27017/ecoyantra
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in your .env file}
      CARBON_ML_URL: http://carbon-ml:8000
      ANOMALY_ML_URL: http://anomaly-ml:8000
      FOREST_ML_URL: http://forest-ml:8000
      S3_ENDPOINT: http://minio:9000
    init: true
    ports:
      - "${API_PORT:-4000}:4000"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:4000/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - platform

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes: [mongo-data:/data/db]
    networks: [platform]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    networks: [platform]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes: [minio-data:/data]
    networks: [platform]

  carbon-ml:
    build: ./ML/Carbon
    networks: [platform]

  anomaly-ml:
    build: ./ML/Anomaly
    environment: { SEED_DEMO_DATA: "false" }
    networks: [platform]

  forest-ml:
    build: ./ML/Forest
    networks: [platform]

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:4000}
    environment:
      HOSTNAME: 0.0.0.0
      NODE_ENV: production
      PORT: 3000
    init: true
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - platform

networks:
  platform:
    driver: bridge

volumes:
  mongo-data:
  minio-data:
